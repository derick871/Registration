<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zindua | Registration</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header class="main-nav">
        <div class="nav-container">
            <div class="logo">Zindua<span>School</span></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="intro-section">
        <h1><span>UI Design</span></h1>
        <p>I'm Derick Wanyama from Nairobi, Kenya, part of the <strong>Zindua School of Technology</strong> team.</p>
    </section>

    <div class="container">
        <h2>Join the Community</h2>
        <p class="form-subtitle">Create your account to get started.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" name="username" placeholder="e.g. Derick Wanyama" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="date">Date of Birth</label>
                <input type="date" id="date" name="date" required>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
        </form>
    </div>
</body>
</html>
